; Spike S1a / S2 bench — two roles from one source tree.
;
;   pio run -e tx -t upload --upload-port /dev/ttyACM1     (transmitter / "anchor")
;   pio run -e rx -t upload --upload-port /dev/ttyACM2     (receiver / "watch")
;
; Pinned to the same toolchain the watch ships on (Arduino-ESP32 2.0.17 /
; IDF 4.4.7) so the esp_power_level_t mapping measured here is the mapping the
; product actually gets. Bare `platform = espressif32` is not used on purpose:
; it resolves to whatever is registered globally.

[env]
platform = espressif32@6.9.0
board = esp32-c3-devkitc-02
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino@^2.0.0
    symlink://../..
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; Native USB-JTAG CDC: the link is not a real UART, so esptool's mid-flash
; "changing baud rate to 460800" step can drop the connection outright. Pinning
; upload_speed to the initial baud makes esptool skip the switch entirely.
upload_speed = 115200
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes

[env:tx]
build_flags =
    ${env.build_flags}
    -DPROXIMITY_ROLE_ANCHOR
    -DBENCH_ROLE_TX=1

[env:rx]
build_flags =
    ${env.build_flags}
    -DPROXIMITY_ROLE_WATCH
    -DBENCH_ROLE_RX=1
